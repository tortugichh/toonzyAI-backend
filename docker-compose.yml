version: '3.8'

services:
  backend:
    build: .
    container_name: toonzyai-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - ./static:/app/static
      - .:/app
      - ./service-account-key:/app/service-account-key

  db:
    image: postgres:15
    container_name: toonzyai-db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
 